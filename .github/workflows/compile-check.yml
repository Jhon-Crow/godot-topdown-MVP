name: Compile Check

# This workflow verifies that all project code compiles successfully:
# - C# code via dotnet build
# - GDScript code via Godot headless project import
# See issue #1448 for context.

on:
  push:
    branches: [ main, issue-* ]
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

# Note: Using pull_request_target instead of pull_request to allow CI to run
# even when the PR branch has merge conflicts with main (Issue #459).

jobs:
  compile-csharp:
    name: C# Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build C# project
        run: |
          echo "Building C# project..."
          if ! dotnet build --no-restore --configuration Debug 2>&1 | tee build-output.log; then
            echo "::error::C# build failed!"
            cat build-output.log
            exit 1
          fi
          echo "C# compilation succeeded."

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: csharp-build-log
          path: build-output.log

  compile-gdscript:
    name: GDScript Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.3-stable_mono_linux_x86_64.zip
          mv Godot_v4.3-stable_mono_linux_x86_64 godot
          chmod +x godot/Godot_v4.3-stable_mono_linux.x86_64

      - name: Import and validate project
        run: |
          # Godot's --import validates all scripts in the project context
          # (autoloads, class_name, preloads are all resolved correctly)
          timeout 120 godot/Godot_v4.3-stable_mono_linux.x86_64 --headless --import . 2>&1 | tee import-output.log || true

      - name: Check for GDScript compilation errors
        run: |
          echo "Checking for GDScript compilation errors in source directories..."
          errors=0

          # Check for script parse errors in the main source directories
          # (scripts/, scenes/) — skip experiments/ docs/ and addons/
          while IFS= read -r line; do
            # Extract the file path from Godot error output (res://path format)
            file=$(echo "$line" | grep -oP 'res://\K(scripts|scenes)/[^)]+\.gd' || true)
            if [ -n "$file" ]; then
              echo "::error file=$file::$line"
              errors=$((errors + 1))
            fi
          done < <(grep "SCRIPT ERROR: Parse Error:" import-output.log || true)

          echo ""
          if [ "$errors" -gt 0 ]; then
            echo "GDScript compilation failed: found $errors parse error(s) in source files."
            echo "See import-output.log for details."
            exit 1
          fi

          # Also check for failed script loads in source directories
          load_errors=0
          while IFS= read -r line; do
            file=$(echo "$line" | grep -oP 'res://\K(scripts|scenes)/[^"]+\.gd' || true)
            if [ -n "$file" ]; then
              echo "::error file=$file::Failed to load script"
              load_errors=$((load_errors + 1))
            fi
          done < <(grep 'Failed to load script' import-output.log || true)

          if [ "$load_errors" -gt 0 ]; then
            echo "GDScript compilation failed: $load_errors script(s) failed to load."
            exit 1
          fi

          echo "All GDScript source files compiled successfully."

      - name: Upload import log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gdscript-import-log
          path: import-output.log
