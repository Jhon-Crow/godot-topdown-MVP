name: Compile Check

# This workflow verifies that all project code compiles successfully:
# - C# code via dotnet build
# - GDScript code via Godot headless validation
# See issue #1448 for context.

on:
  push:
    branches: [ main, issue-* ]
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

# Note: Using pull_request_target instead of pull_request to allow CI to run
# even when the PR branch has merge conflicts with main (Issue #459).

jobs:
  compile-csharp:
    name: C# Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build C# project
        run: |
          echo "Building C# project..."
          if ! dotnet build --no-restore --configuration Debug 2>&1 | tee build-output.log; then
            echo "::error::C# build failed!"
            cat build-output.log
            exit 1
          fi
          echo "C# compilation succeeded."

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: csharp-build-log
          path: build-output.log

  compile-gdscript:
    name: GDScript Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.3-stable_mono_linux_x86_64.zip
          mv Godot_v4.3-stable_mono_linux_x86_64 godot
          chmod +x godot/Godot_v4.3-stable_mono_linux.x86_64

      - name: Import project
        run: |
          # Godot import step is required to build the project cache
          timeout 120 godot/Godot_v4.3-stable_mono_linux.x86_64 --headless --import . 2>&1 | tee import-output.log || true

      - name: Validate GDScript files
        run: |
          echo "Validating GDScript compilation..."
          errors=0
          error_files=""

          # Find all .gd files in project source directories (skip addons)
          while IFS= read -r file; do
            # Use Godot's --check-only to validate each script
            output=$(godot/Godot_v4.3-stable_mono_linux.x86_64 --headless --check-only --script "$file" 2>&1) || {
              # Filter out known false positives from autoload/singleton references
              if echo "$output" | grep -q "Parse Error\|Error\|SCRIPT ERROR"; then
                echo "::error file=$file::GDScript compilation failed"
                echo "$output"
                error_files="$error_files $file"
                errors=$((errors + 1))
              fi
            }
          done < <(find scripts -name "*.gd" -type f | sort)

          echo ""
          if [ "$errors" -gt 0 ]; then
            echo "GDScript compilation failed: $errors file(s) with errors:"
            for f in $error_files; do
              echo "  - $f"
            done
            exit 1
          fi

          echo "All GDScript files compiled successfully."

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gdscript-compile-log
          path: import-output.log
