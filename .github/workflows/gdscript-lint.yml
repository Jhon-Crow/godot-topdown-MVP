name: GDScript Code Quality Lint

on:
  push:
    branches: [ main, issue-* ]
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

# Note: Using pull_request_target instead of pull_request to allow CI to run
# even when the PR branch has merge conflicts with main (Issue #459).
# This is safe for this workflow as it only performs static analysis.

jobs:
  gdscript-lint:
    name: Check GDScript Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for nested loops (O(n²) complexity)
        run: |
          echo "Checking for nested loops that may indicate O(n²) or worse complexity..."
          warnings=0

          # Use awk for fast multi-line analysis instead of shell line-by-line
          while IFS= read -r file; do
            results=$(awk '
            /^[[:space:]]*(for |while )/ && !/^[[:space:]]*#/ {
              indent = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "\t") indent++
                else break
              }
              if (prev_loop_indent >= 0 && indent > prev_loop_indent) {
                print FILENAME ":" NR ": nested loop"
              }
              prev_loop_indent = indent
              next
            }
            !/^[[:space:]]*$/ && !/^[[:space:]]*#/ {
              indent = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "\t") indent++
                else break
              }
              if (prev_loop_indent >= 0 && indent <= prev_loop_indent) {
                prev_loop_indent = -1
              }
            }
            BEGIN { prev_loop_indent = -1 }
            ' "$file" 2>/dev/null)

            while IFS= read -r result; do
              if [ -n "$result" ]; then
                fpath=$(echo "$result" | cut -d: -f1)
                lnum=$(echo "$result" | cut -d: -f2)
                echo "::warning file=$fpath,line=$lnum::Nested loop detected (potential O(n²) complexity). Consider using a dictionary/set for lookups."
                warnings=$((warnings + 1))
              fi
            done <<< "$results"
          done < <(find scripts -name "*.gd" -type f 2>/dev/null)

          echo "Found $warnings nested loop warning(s) (non-blocking)."

      - name: Check for unbounded while loops
        run: |
          echo "Checking for potentially unbounded while loops..."
          # Find 'while true:' without a 'break' or 'return' in the same file region
          warnings=0
          while IFS= read -r result; do
            file=$(echo "$result" | cut -d: -f1)
            line=$(echo "$result" | cut -d: -f2)
            echo "::warning file=$file,line=$line::Found 'while true' loop. Ensure it has a break/return condition."
            warnings=$((warnings + 1))
          done < <(grep -rn '^\s*while\s\+true\s*:' scripts/ --include="*.gd" 2>/dev/null || true)

          echo "Found $warnings 'while true' occurrence(s) (non-blocking)."

      - name: Check for large functions
        run: |
          echo "Checking for functions exceeding 50 lines..."
          warnings=0
          FUNC_MAX_LINES=50

          while IFS= read -r file; do
            results=$(awk -v max_lines="$FUNC_MAX_LINES" '
            /^[[:space:]]*func[[:space:]]+/ && !/^[[:space:]]*#/ {
              if (func_name != "" && (NR - func_start) > max_lines) {
                print FILENAME ":" func_start ": " func_name " (" (NR - func_start) " lines)"
              }
              match($0, /func[[:space:]]+([a-zA-Z_][a-zA-Z0-9_]*)/, arr)
              func_name = arr[1]
              func_start = NR
            }
            END {
              if (func_name != "" && (NR - func_start) > max_lines) {
                print FILENAME ":" func_start ": " func_name " (" (NR - func_start) " lines)"
              }
            }
            ' "$file" 2>/dev/null)

            while IFS= read -r result; do
              if [ -n "$result" ]; then
                fpath=$(echo "$result" | cut -d: -f1)
                lnum=$(echo "$result" | cut -d: -f2)
                detail=$(echo "$result" | cut -d: -f3-)
                echo "::warning file=$fpath,line=$lnum::Large function:$detail. Consider splitting into smaller functions."
                warnings=$((warnings + 1))
              fi
            done <<< "$results"
          done < <(find scripts -name "*.gd" -type f 2>/dev/null)

          echo "Found $warnings large function warning(s) (non-blocking)."

      - name: Check for deep nesting
        run: |
          echo "Checking for deeply nested code (>4 levels)..."
          warnings=0
          MAX_NESTING=4

          while IFS= read -r file; do
            results=$(awk -v max_nesting="$MAX_NESTING" '
            /^[[:space:]]*(if |elif |else:|for |while |match )/ && !/^[[:space:]]*#/ {
              indent = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "\t") indent++
                else break
              }
              if (indent > max_nesting) {
                print FILENAME ":" NR ": level " indent
              }
            }
            ' "$file" 2>/dev/null)

            while IFS= read -r result; do
              if [ -n "$result" ]; then
                fpath=$(echo "$result" | cut -d: -f1)
                lnum=$(echo "$result" | cut -d: -f2)
                detail=$(echo "$result" | cut -d: -f3-)
                echo "::warning file=$fpath,line=$lnum::Deep nesting detected ($detail, max $MAX_NESTING). Consider extracting to a helper function."
                warnings=$((warnings + 1))
              fi
            done <<< "$results"
          done < <(find scripts -name "*.gd" -type f 2>/dev/null)

          echo "Found $warnings deep nesting warning(s) (non-blocking)."

      - name: Check for duplicate dictionary key lookups
        run: |
          echo "Checking for repeated dictionary key access patterns..."
          # Simple grep-based check: find files with many dict[key] accesses
          warnings=0
          while IFS= read -r file; do
            # Count unique dict[key] patterns that appear 4+ times
            repeated=$(grep -oE '[a-zA-Z_][a-zA-Z0-9_]*\[[^]]+\]' "$file" 2>/dev/null | sort | uniq -c | awk '$1 >= 4 { print $2 " (" $1 " times)" }')
            if [ -n "$repeated" ]; then
              while IFS= read -r pattern; do
                echo "::warning file=$file::Repeated dictionary access: $pattern. Consider caching in a local variable."
                warnings=$((warnings + 1))
              done <<< "$repeated"
            fi
          done < <(find scripts -name "*.gd" -type f 2>/dev/null)

          echo "Found $warnings duplicate lookup warning(s) (non-blocking)."

      - name: Summary
        run: |
          echo "=== GDScript Code Quality Lint Complete ==="
          echo ""
          echo "Checks performed:"
          echo "  ✓ Nested loops (O(n²) complexity detection)"
          echo "  ✓ Unbounded while loops (while true detection)"
          echo "  ✓ Large functions (>50 lines)"
          echo "  ✓ Deep nesting (>4 levels)"
          echo "  ✓ Duplicate dictionary key lookups"
          echo ""
          echo "Note: All checks produce warnings, not errors."
          echo "This allows gradual improvement without blocking merges."
          echo "Fix warnings to improve code quality and performance."
