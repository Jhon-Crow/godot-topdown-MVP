name: Build Windows Portable EXE

on:
  push:
    branches: [ main, issue-* ]
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:

# Note: Using pull_request_target instead of pull_request to allow CI to run
# even when the PR branch has merge conflicts with main (Issue #459).

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For pull_request_target, explicitly checkout the PR head commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Generate build_info.cfg so the game log shows which branch/commit was used.
      # This helps diagnose "wrong build" issues (e.g., Issue #1417 sessions 3-6).
      # Issue #1927: under pull_request_target the default ${{ github.sha }} points at
      # the merge commit on main, not the PR head, so logs reported a stale SHA that
      # no longer existed on the branch.  Prefer pull_request.head.sha when available
      # so the recorded commit matches the actual code that was built.
      - name: Generate build_info.cfg
        run: |
          cat > build_info.cfg <<EOF
          [build]
          branch="${{ github.head_ref || github.ref_name }}"
          commit="${{ github.event.pull_request.head.sha || github.sha }}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pr="${{ github.event.pull_request.number || '' }}"
          EOF
          echo "Generated build_info.cfg:"
          cat build_info.cfg

      # Required for C# projects: Godot's headless export doesn't compile C# sources
      # automatically, so we must build .NET assemblies first. Without this step,
      # the data_* folder with .NET assemblies will be missing in the export.
      # See: https://forum.godotengine.org/t/no-data-folder-created-on-export/110235
      - name: Build .NET project
        run: |
          dotnet restore GodotTopDownTemplate.sln
          dotnet build GodotTopDownTemplate.sln --configuration Release

      # Wine is required for rcedit to embed the custom icon into the Windows exe.
      # Without this, export_presets.cfg application/icon is ignored and the exe
      # keeps the default Godot icon. See: https://github.com/firebelley/godot-export
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine64 wine32:i386
          WINE_BIN=$(which wine64 || which wine)
          echo "Found wine at: $WINE_BIN"
          echo "WINE_PATH=$WINE_BIN" >> "$GITHUB_OUTPUT"

      - name: Export game
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.export.outputs.archive_directory }}/*
