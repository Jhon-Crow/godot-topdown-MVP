<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <!-- Neon glow filter for crosshair -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle figure glow -->
    <filter id="figureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring (tactical) -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#2a0a1a" stroke-width="4"/>

  <!-- Blood/neon splatter spots in background (Hotline Miami energy) -->
  <circle cx="60" cy="55" r="6" fill="#ff2244" opacity="0.18"/>
  <circle cx="195" cy="70" r="4" fill="#ff2244" opacity="0.12"/>
  <circle cx="45" cy="185" r="5" fill="#ff2244" opacity="0.15"/>
  <circle cx="210" cy="195" r="7" fill="#ff2244" opacity="0.10"/>
  <circle cx="170" cy="40" r="3" fill="#cc1133" opacity="0.20"/>

  <!-- Top-down figure: body (viewed from above) -->
  <!-- Torso - elongated oval, slightly tilted -->
  <ellipse cx="128" cy="122" rx="18" ry="26" fill="#111111" filter="url(#figureGlow)"/>

  <!-- Head (top-down circle) -->
  <circle cx="128" cy="92" r="14" fill="#0f0f0f" filter="url(#figureGlow)"/>

  <!-- Arms extended holding weapon -->
  <!-- Left arm -->
  <ellipse cx="104" cy="116" rx="8" ry="5" fill="#111111" transform="rotate(-20, 104, 116)"/>
  <!-- Right arm -->
  <ellipse cx="152" cy="116" rx="8" ry="5" fill="#111111" transform="rotate(20, 152, 116)"/>

  <!-- Weapon barrel (pointing up — top-down view of gun aiming forward) -->
  <rect x="123" y="58" width="10" height="32" rx="2" fill="#1a1a1a"/>
  <!-- Gun grip/body -->
  <rect x="120" y="78" width="16" height="20" rx="3" fill="#222222"/>

  <!-- Legs -->
  <ellipse cx="116" cy="152" rx="9" ry="12" fill="#111111" transform="rotate(-5, 116, 152)"/>
  <ellipse cx="140" cy="152" rx="9" ry="12" fill="#111111" transform="rotate(5, 140, 152)"/>

  <!-- === CROSSHAIR (neon pink-red, Hotline Miami style) === -->
  <!-- Outer circle -->
  <circle cx="128" cy="128" r="68" fill="none" stroke="#ff2244" stroke-width="2.5" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Inner circle -->
  <circle cx="128" cy="128" r="44" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.7" filter="url(#neonGlow)"/>

  <!-- Crosshair lines - horizontal -->
  <line x1="50" y1="128" x2="80" y2="128" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="176" y1="128" x2="206" y2="128" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Crosshair lines - vertical -->
  <line x1="128" y1="50" x2="128" y2="80" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="128" y1="176" x2="128" y2="206" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Center dot -->
  <circle cx="128" cy="128" r="3.5" fill="#ff2244" filter="url(#neonGlow)"/>

  <!-- Neon accent tick marks on outer ring (tactical/DK2 style) -->
  <line x1="128" y1="58" x2="128" y2="65" stroke="#ff2244" stroke-width="2" opacity="0.6"/>
  <line x1="128" y1="191" x2="128" y2="198" stroke="#ff2244" stroke-width="2" opacity="0.6"/>
  <line x1="58" y1="128" x2="65" y2="128" stroke="#ff2244" stroke-width="2" opacity="0.6"/>
  <line x1="191" y1="128" x2="198" y2="128" stroke="#ff2244" stroke-width="2" opacity="0.6"/>

  <!-- Corner brackets (Door Kickers 2 tactical HUD style) -->
  <path d="M 30 30 L 50 30 L 50 50" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <path d="M 226 30 L 206 30 L 206 50" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <path d="M 30 226 L 50 226 L 50 206" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <path d="M 226 226 L 206 226 L 206 206" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
</svg>
