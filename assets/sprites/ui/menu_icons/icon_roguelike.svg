<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dice (roguelike / random) with clear dots -->
  <rect x="3" y="3" width="26" height="26" rx="5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- 5-dot pattern like a real die face -->
  <circle cx="10" cy="10" r="2.2" fill="white"/>
  <circle cx="22" cy="10" r="2.2" fill="white"/>
  <circle cx="16" cy="16" r="2.2" fill="white"/>
  <circle cx="10" cy="22" r="2.2" fill="white"/>
  <circle cx="22" cy="22" r="2.2" fill="white"/>
</svg>
