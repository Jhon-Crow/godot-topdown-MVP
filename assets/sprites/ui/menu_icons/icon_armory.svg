<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Crossed swords with visible guards and hilts -->
  <!-- Sword 1: top-left to bottom-right blade -->
  <line x1="5" y1="5" x2="20" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sword 1 tip -->
  <line x1="20" y1="20" x2="23" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Sword 1 guard (cross-piece) -->
  <line x1="17" y1="11" x2="11" y2="17" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 1 hilt -->
  <rect x="3" y="3" width="5" height="5" rx="1" fill="white"/>

  <!-- Sword 2: top-right to bottom-left blade -->
  <line x1="27" y1="5" x2="12" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sword 2 tip -->
  <line x1="12" y1="20" x2="9" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Sword 2 guard (cross-piece) -->
  <line x1="15" y1="11" x2="21" y2="17" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 2 hilt -->
  <rect x="24" y="3" width="5" height="5" rx="1" fill="white"/>
</svg>
