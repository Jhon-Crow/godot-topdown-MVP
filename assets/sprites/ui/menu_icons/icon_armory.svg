<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Crossed swords with guards clearly separated from the crossing point -->
  <!-- Sword 1: blade from top-left (tip) to bottom-right (hilt area) -->
  <line x1="4" y1="4" x2="28" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sword 1 guard: positioned near hilt, far from crossing (bottom-right area) -->
  <line x1="20" y1="26" x2="26" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 1 hilt -->
  <line x1="27" y1="29" x2="24" y2="26" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sword 2: blade from top-right (tip) to bottom-left (hilt area) -->
  <line x1="28" y1="4" x2="4" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sword 2 guard: positioned near hilt, far from crossing (bottom-left area) -->
  <line x1="12" y1="26" x2="6" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 2 hilt -->
  <line x1="5" y1="29" x2="8" y2="26" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>
